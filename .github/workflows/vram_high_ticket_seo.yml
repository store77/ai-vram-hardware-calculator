name: Auto High-Ticket AI VRAM Affiliate Engine

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run High-Ticket Affiliate Generator
        env:
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME="${{ github.event.repository.name }}"
          if [ -n "$CUSTOM_SITE_URL" ]; then
            export SITE_URL="$CUSTOM_SITE_URL"
          else
            export SITE_URL="https://${OWNER}.github.io/${REPO_NAME}"
          fi
          python vram_affiliate_engine.py

      - name: Commit & Push Generated Static Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "Tidak ada model baru hari ini."
          else
            git commit -m "chore(seo): build new high-ticket AI hardware pages [skip ci]"
            git push
          fi
